<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 Ads — anchored bubble demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Real production stylesheet, so tokens/cards/detail panel look exactly like live -->
<link rel="stylesheet" href="css/style.css">
<style>
  /* ══ DEMO CHROME ══════════════════════════════════════ */
  html, body { height: 100%; }
  .demo-wrap { display: flex; flex-direction: column; height: 100vh; }
  .demo-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--border-light);
    background: var(--bg); flex: none; font-size: 13px; color: var(--text2);
  }
  .demo-bar strong { color: var(--text); font-weight: 600; }
  .demo-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .demo-toggle button {
    font: inherit; font-size: 12px; padding: 6px 14px; border: 0; cursor: pointer;
    background: var(--bg); color: var(--text2);
  }
  .demo-toggle button + button { border-left: 1px solid var(--border); }
  .demo-toggle button.active { background: var(--text); color: #fff; }
  .demo-hint { margin-left: auto; color: var(--text3); font-size: 12px; }
  .demo-main { flex: 1; display: flex; min-height: 0; }
  .demo-map-panel { position: relative; flex: 1; min-width: 0; }
  #map { position: absolute; inset: 0; }
  .demo-gallery {
    width: 320px; flex: none; border-left: 1px solid var(--border-light);
    overflow-y: auto; padding: 12px; background: var(--bg);
  }

  /* ══ PROPOSED: ANCHORED BUBBLE ════════════════════════ */
  .bb-popup .leaflet-popup-content-wrapper {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10), 0 12px 40px rgba(0,0,0,0.18);
    padding: 0;
    overflow: hidden;
  }
  .bb-popup .leaflet-popup-content { margin: 0; width: 320px !important; line-height: 1.4; }
  /* The tail that points down at the billboard */
  .bb-popup .leaflet-popup-tip-container { width: 24px; height: 13px; margin-left: -12px; }
  .bb-popup .leaflet-popup-tip {
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    width: 14px; height: 14px; margin: -8px auto 0;
  }
  .bb-popup .leaflet-popup-close-button { display: none; }

  .bb-img-wrap { position: relative; width: 100%; aspect-ratio: 16/10; background: var(--surface2); cursor: zoom-in; }
  .bb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bb-close {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
    border: 0; border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1;
    background: rgba(0,0,0,0.45); color: #fff;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .bb-close:hover { background: rgba(0,0,0,0.65); }
  .bb-cat {
    position: absolute; left: 10px; bottom: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 5px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .bb-body { padding: 12px 14px 13px; }
  .bb-company { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bb-logo { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; flex: none; }
  .bb-company-name { font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
  .bb-company-name:hover { text-decoration: underline; }
  .bb-ocr {
    font-size: 15px; font-weight: 400; line-height: 1.4; letter-spacing: -0.2px;
    color: var(--text); margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bb-meta {
    font-size: 11px; color: var(--text3); border-top: 1px solid var(--border-light);
    padding-top: 8px; display: flex; justify-content: space-between; gap: 10px;
  }
  .bb-meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ══ CURRENT MODE: reuse real .detail-panel, but scoped to demo ══ */
  .demo-map-panel .detail-panel { --chip-inset: 20px; }
</style>
</head>
<body>

<div class="demo-wrap">
  <div class="demo-bar">
    <strong>Bubble demo</strong>
    <div class="demo-toggle">
      <button id="modeCurrent">Current: bottom sheet</button>
      <button id="modeBubble" class="active">Proposed: anchored bubble</button>
    </div>
    <span class="demo-hint">Click any dot on the map. Real data, real tiles.</span>
  </div>

  <div class="demo-main">
    <div class="demo-map-panel">
      <div id="map"></div>
      <!-- current-mode detail panel, real production markup/classes -->
      <div class="detail-panel" id="detailPanel">
        <button class="detail-close" id="detailClose">✕</button>
        <div id="detailContent"></div>
      </div>
    </div>
    <div class="demo-gallery" id="galleryList"></div>
  </div>
</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_KEY, normalizeBillboard, catColor, catStyle, logoUrl, formatDate }
  from './js/config.js';

let mode = 'bubble';          // 'bubble' | 'current'
let rows = [];
let selectedId = null;
let markers = {};
let popup = null;

// ── MAP ────────────────────────────────────────────────
const map = L.map('map', { center: [37.55, -122.05], zoom: 11, zoomControl: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2hr0_1_632140ccea23141a89ed7071', {
  attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);
window.__map = map; // exposed for quick console poking

// ── BUBBLE CONTENT ─────────────────────────────────────
function bubbleHtml(b) {
  const color = catColor(b.category);
  const img = b.image_url
    ? `<div class="bb-img-wrap">
         <img class="bb-img" src="${b.image_url}" alt="">
         <button class="bb-close" data-close>✕</button>
         <span class="bb-cat" style="background:${color}e6;color:#fff;">${b.category || 'Uncategorized'}</span>
       </div>`
    : `<div class="bb-img-wrap"><button class="bb-close" data-close>✕</button></div>`;

  const lurl = logoUrl(b);
  const company = b.company_name
    ? `<div class="bb-company">
         ${lurl ? `<img class="bb-logo" src="${lurl}" alt="" onerror="this.style.display='none'">` : ''}
         ${b.company_url
            ? `<a class="bb-company-name" href="${b.company_url}" target="_blank" rel="noopener">${b.company_name}</a>`
            : `<span class="bb-company-name">${b.company_name}</span>`}
       </div>`
    : '';

  const where = b.address ? b.address.split(',')[0]
              : `${(b.latitude || 0).toFixed(4)}, ${(b.longitude || 0).toFixed(4)}`;

  return `${img}
    <div class="bb-body">
      ${company}
      <div class="bb-ocr">${b.ocr_text || '(no text detected)'}</div>
      <div class="bb-meta"><span>📍 ${where}</span><span>${formatDate(b.captured_at)}</span></div>
    </div>`;
}

// ── CURRENT-MODE PANEL (mirrors js/gallery.js renderDetailPanel) ──
function renderCurrentPanel(b) {
  const panel = document.getElementById('detailPanel');
  if (!b) { panel.classList.remove('open'); return; }
  const lurl = logoUrl(b);
  document.getElementById('detailContent').innerHTML = `
    ${b.image_url ? `<div class="detail-img-wrap"><img class="detail-img" src="${b.image_url}" alt=""></div>` : ''}
    <span class="detail-category" style="${catStyle(b.category)}">${b.category || 'Uncategorized'}</span>
    ${b.company_name ? `<div class="detail-company">
        ${lurl ? `<img class="detail-company-logo" src="${lurl}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="detail-company-info"><span class="detail-company-name">${b.company_name}</span></div>
      </div>` : ''}
    <div class="detail-ocr">${b.ocr_text || '(no text detected)'}</div>
    <div class="detail-coords">📍 ${b.address || 'Unknown'}<br>${(b.latitude || 0).toFixed(6)}, ${(b.longitude || 0).toFixed(6)}<br>🕐 ${formatDate(b.captured_at, true)}</div>`;
  panel.classList.add('open');
}

// ── SELECT ─────────────────────────────────────────────
function select(id) {
  selectedId = (selectedId === id) ? null : id;
  const b = rows.find(x => x.id === selectedId);
  renderMarkers();
  renderGallery();

  if (mode === 'bubble') {
    document.getElementById('detailPanel').classList.remove('open');
    if (popup) { map.closePopup(popup); popup = null; }
    if (!b || !b.latitude) return;
    popup = L.popup({
      className: 'bb-popup',
      maxWidth: 320, minWidth: 320,
      closeButton: false,
      offset: [0, 1],
      autoPan: true,
      // keep the bubble clear of the demo bar and the gallery rail
      autoPanPaddingTopLeft: [30, 30],
      autoPanPaddingBottomRight: [30, 30],
      autoClose: true,
      closeOnClick: false,
    })
      .setLatLng([b.latitude, b.longitude])
      .setContent(bubbleHtml(b))
      .openOn(map);

    // gentle recentre only if needed — autoPan already handles the common case
    map.panTo([b.latitude, b.longitude], { animate: true, duration: 0.4 });
  } else {
    // current behaviour: slide up sheet + shove marker above it
    if (popup) { map.closePopup(popup); popup = null; }
    renderCurrentPanel(b);
    if (!b || !b.latitude) return;
    const zoom = 15;
    const mapH = map.getSize().y;
    const panelH = mapH * 0.65;
    const offsetPx = (panelH / 2) + ((mapH - panelH) * 0.1);
    map.setView([b.latitude, b.longitude], zoom, { animate: false });
    const pt = map.latLngToContainerPoint(L.latLng(b.latitude, b.longitude));
    map.setView(map.containerPointToLatLng(L.point(pt.x, pt.y + offsetPx)), zoom, { animate: true });
  }
}

// close button inside the bubble
map.on('popupopen', e => {
  e.popup.getElement().querySelector('[data-close]')?.addEventListener('click', () => {
    selectedId = null; map.closePopup(e.popup); popup = null; renderMarkers(); renderGallery();
  });
});

// ── MARKERS (same visual language as js/map.js) ────────
function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  rows.forEach(b => {
    if (!b.latitude || !b.longitude) return;
    const color = catColor(b.category);
    const sel = b.id === selectedId;
    const size = sel ? 20 : 10;
    const style = sel
      ? `width:${size}px;height:${size}px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 0 3px ${color},0 2px 8px rgba(0,0,0,0.35);`
      : `width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);`;
    markers[b.id] = L.marker([b.latitude, b.longitude], {
      icon: L.divIcon({ html: `<div style="${style}"></div>`, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] })
    }).addTo(map).on('click', () => select(b.id));
  });
}

// ── GALLERY ────────────────────────────────────────────
function renderGallery() {
  const list = document.getElementById('galleryList');
  list.innerHTML = '';
  rows.forEach(b => {
    const card = document.createElement('div');
    card.className = 'billboard-card' + (b.id === selectedId ? ' selected' : '');
    card.innerHTML = `
      <div class="card-img">${b.image_url ? `<img src="${b.image_url}" alt="" loading="lazy">` : '🖼'}</div>
      <div class="card-body">
        <span class="card-category" style="${catStyle(b.category)}">${b.category || 'Uncategorized'}</span>
        <div class="card-ocr">${b.ocr_text || '(no text detected)'}</div>
        <div class="card-meta">${b.address ? b.address.split(',')[0] : ''} · ${formatDate(b.captured_at)}</div>
      </div>`;
    card.addEventListener('click', () => select(b.id));
    list.appendChild(card);
  });
}

// ── MODE TOGGLE ────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('modeBubble').classList.toggle('active', m === 'bubble');
  document.getElementById('modeCurrent').classList.toggle('active', m === 'current');
  const keep = selectedId;
  selectedId = null;
  if (popup) { map.closePopup(popup); popup = null; }
  document.getElementById('detailPanel').classList.remove('open');
  if (keep) select(keep);
  renderMarkers();
}
document.getElementById('modeBubble').onclick = () => setMode('bubble');
document.getElementById('modeCurrent').onclick = () => setMode('current');
document.getElementById('detailClose').onclick = () => {
  selectedId = null;
  document.getElementById('detailPanel').classList.remove('open');
  renderMarkers(); renderGallery();
};

// ── DATA ───────────────────────────────────────────────
const FALLBACK = [
  { id:'d1', category:'AI & Tech', company_name:'Demo Co', ocr_text:'STOP HIRING HUMANS', address:'Bayshore Fwy, San Mateo, CA',
    latitude:37.5485, longitude:-122.2916, captured_at:'2026-06-14T18:20:00Z', image_url:null },
  { id:'d2', category:'Finance', company_name:'Sample Bank', ocr_text:'YOUR MONEY, BUT FASTER', address:'US-101, Redwood City, CA',
    latitude:37.4852, longitude:-122.2364, captured_at:'2026-07-02T16:05:00Z', image_url:null },
];

(async () => {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/billboards?order=captured_at.desc&limit=60`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    const data = await res.json();
    rows = Array.isArray(data) && data.length ? data.map(normalizeBillboard) : FALLBACK.map(normalizeBillboard);
  } catch {
    rows = FALLBACK.map(normalizeBillboard);
  }
  renderMarkers();
  renderGallery();
  const pts = rows.filter(b => b.latitude && b.longitude).map(b => [b.latitude, b.longitude]);
  if (pts.length) map.fitBounds(pts, { padding: [50, 50] });
})();
</script>
</body>
</html>
