<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 Ads</title>
<meta name="robots" content="noindex">
<script>
// Fallback for /b/<id>/ share links whose static page isn't built yet.
// tools/build-share-pages.mjs runs on a schedule (.github/workflows/share-pages.yml),
// so a billboard published after the last run has a Share link with no page
// behind it. Send those visitors to the app with the billboard selected
// instead of a dead end. Link previews for it appear after the next build.
(function () {
  var m = location.pathname.match(/^\/b\/([0-9a-f-]{6,36})\/?$/i);
  location.replace(m ? '/?b=' + m[1].toLowerCase() : '/');
})();
</script>
<style>body{font:15px/1.5 -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:#1d1d1f;margin:0;display:grid;place-items:center;min-height:100vh}a{color:#0071e3}</style>
</head>
<body>
<p><a href="/">Open the 101 Ads map →</a></p>
</body>
</html>
